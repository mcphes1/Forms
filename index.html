<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Untitled Document</title>
<style>
    @font-face {
        font-family: Candara;
        src: url("Candara.ttf");
    } h1 {
        text-align: center;
        font-weight: normal;
    } form {
        width: 600px;
        min-height: 600px;
        padding: 24px;
        background: lightblue;
        margin: 36px auto;
        border: 1px solid blue;
        box-shadow: 2px 3px 6px blue;
        border-radius: 18px;
        font: 14pt/1.2em Candara;
    } fieldset {
        margin-top: 18px;
    } #personal input, #submit {
        width: 100%;
        height: 24px;
        margin-bottom: 12px;
	} input[type="text"] {
		width: 98%;
	font: 12pt/1.4em; }
	select {
		width: 50%;
			font: 12pt/1.4em;
		padding: 2px 4px;
	} textarea {
		width: 98%;
	}input[type="submit"] {
		width:100px;
		height: 40px;
		background: lightgreen;
		display: block;
		margin 0 auto;
	}
</style>
</head>

<body>
    <form action="https://formsubmit.co/mcphes1@unlv.nevada.edu" method="post">
    <h1>Contact Us</h1>
		
		<input type="text" name="first-name"/><br/>
		<label>First name</label><br/>
		<input type="text" name="last-name" ><br/>
		<label>Last name</label><br/>
		<input type="text" name="email"/><br/>
		<label>Email</label><br/><br/>
		
		<fieldset>
			<legend>Operating systems</legend>
		<input type="radio" name="os"/> <label>Mac OS</label><br/>
		<input type="radio" name="os"/> <label>Windows</label><br/>
		<input type="radio" name="os"/> <label>UNIX</label><br/>
			</fieldset>
		<fieldset>
			<legend>Services desired</legend>
		<input type="checkbox"> <label>Design</label><br/>
		<input type="checkbox"> <label>UX/UI</label><br/>
		<input type="checkbox"> <label>Consulting</label><br/>
	</fieldset> <br/>
		
		<label>What is your time frame?</label><br/>
		<select>
		<option>ASAP</option>
		<option>This Week</option>
		<option>This Month</option>
		<option>This Year</option>
		<option>Not Sure</option>
		</select>
		<br/><br/>
		
		<label>Comments</label><br/>
		<textarea>
		</textarea><br/><br>
		
		<input type="submit" value="Submit" /> 
    </form>
</body>
</html>
